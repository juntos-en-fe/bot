services:
  bot:
    build:
      context: .
    image: jef-bot:latest
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/bot.db
    volumes:
      - bot-data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  bot-data:
